<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Vercel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }

    .card {
      text-align: center;
      padding: 48px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #fff, #888);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #999;
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid #333;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    #time {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Vercel 👋</h1>
    <p>เว็บไซต์สถิตแรกของฉัน deploy สำเร็จแล้ว</p>
    <div class="badge">
      <span class="dot"></span>
      <span>Live</span>
    </div>
    <div id="time"></div>
  </div>

  <script>
    const el = document.getElementById('time');
    function updateTime() {
      const now = new Date();
      el.textContent = 'โหลดเมื่อ ' + now.toLocaleString('th-TH');
    }
    updateTime();
  </script>
</body>
</html>
